
# Lookup definition for getting processed 10x pattern parts needed for decoding 10x encoded events.
#
# See macros.conf for more info.
#
# A search head sends the collection to its indexers in the knowledge bundle, written as a series
# of CSV files, and a record at the edge of two files can be written in both: measured on Splunk
# Enterprise 10.4.3, 3 of 403,196 records were twice in an indexer's copy, 3 of its 31 file edges.
# A lookup there returns such a record twice, every output field holding its values twice; the
# inflate macros keep one copy (macros.conf). max_matches is left at its default: set to 1, with
# the copy over max_memtable_bytes (an index on disk) and a search's lookups sent in batches, the
# match of another key was lost instead, one event an hour of 32,905 left compact (the same
# table, measured on Splunk Enterprise 10.4.3).
[tenx-dml-lookup]
case_sensitive_match = true
collection = tenx_dml
external_type = kvstore
fields_list = _key,pattern_hash,pattern,pattern_parts,part_0,pattern_terminator,timestamp_format,expand_unsafe,pattern_search,search_copy,stored_hour


# How far Consume KV has loaded template records (collections.conf [tenx_kv_state]).
[tenx-kv-state-lookup]
collection = tenx_kv_state
external_type = kvstore
fields_list = _key,loaded_through,updated,status,detail,records,run_started,run_ended,last_cut


# Extraction on encoded 10x events to prep them for decoding.
#
# See macros.conf for more info.
#
# Format: ~<hash>,<var0>,<var1>,...  (comma-delimited with ~ prefix), or ~<hash> alone for a
# template with no values. Hash may contain spaces and special characters, so we only split
# on commas. The leading ~ is what makes a line compact: in the same stream the Receiver sends an
# event as its own text when its template is not made yet (templateCreateAfter) or the event is
# 65,535 characters or longer, and such a line never starts with ~ (the engine templates a line that
# does on first sight). A line without it gets none of these fields, so no part of its text is
# looked up as a template hash.
#
# Splunk trims white space at both ends of each value this extraction writes, so tenx_vars loses a
# carriage return or space at either end; the inflate macros read the values from _raw (macros.conf).
#
[tenx-hash-vars-extraction]
REGEX = ^~(?<tenx_hash>[^,]+)(?:,(?<tenx_var_0>[^,]+)(?:,(?<tenx_vars>.*))?)?


# Event time for compact events, set while the event is parsed.
#
# A template with a timestamp slot stores the timestamp as the event's first variable, an
# epoch of 13 digits (milliseconds) or 19 (nanoseconds). Where the first variable has that
# shape and falls inside Splunk's own default window for a timestamp, 2,000 days back and 2
# days ahead, _time is set from it: whole seconds from the first 10 digits and up to 6
# fraction digits from the rest, so no 19-digit value passes through floating point. A slot
# $(+%s.%f) (engine 1.1.181: a line's seconds since the epoch, a dot and 1 to 9 fraction digits,
# such as auditd's msg=audit(1723042099.699:...)) stores that text as written; it is read as a
# number of seconds, in the same window.
# Anything else keeps the time it arrived with: the time an HTTP Event Collector sender gave it,
# else the index time (DATETIME_CONFIG). So does a line that does not start with ~, an event the
# Receiver sent as its own text: its first comma-separated values are its own text, not an epoch.
# The Receiver sends such an event with the line's own timestamp as its time, which the HTTP Event
# Collector keeps.
#
# An event that arrives with the indexed field tenx_time=sender (HTTP Event Collector "fields";
# Fluent Bit event_field tenx_time sender) keeps the time its sender gave it, whatever its first
# variable holds. A sender that read the event's time from its text, such as a heavy forwarder
# whose parsed events reach the Receiver through a file, knows that time; the template's first
# timestamp can be another time of the event (CloudTrail: userIdentity.sessionContext.attributes.
# creationDate). Measured on Splunk 10.4.3: 1,000 compact events with the field and 1,000 without
# metered the same 39,000 bytes, their raw text.
#
# One expression, assigning _time and nothing else. Measured on Splunk 10.4.3, 20,000
# compact events: a fractional _time assigned through a working field, set and removed in
# the same expression, metered 282,078 bytes over the raw text; the same _time computed
# inside the _time assignment metered the raw text exactly, as did a whole-second _time
# through working fields. now() is rejected at index time ("Bad function"); time() is the
# clock.
#
[tenx-event-time]
INGEST_EVAL = _time=if(tenx_time=="sender", _time, if(match(_raw, "^~[^,]+,(\d{13}|\d{19})(,|$)") AND tonumber(substr(replace(_raw, "^~[^,]+,(\d+)(,[\s\S]*)?$", "\1"), 1, 10)) >= time() - 2000*86400 AND tonumber(substr(replace(_raw, "^~[^,]+,(\d+)(,[\s\S]*)?$", "\1"), 1, 10)) <= time() + 2*86400, tonumber(substr(replace(_raw, "^~[^,]+,(\d+)(,[\s\S]*)?$", "\1"), 1, 10)) + tonumber("0." . substr(replace(_raw, "^~[^,]+,(\d+)(,[\s\S]*)?$", "\1"), 11, 6)), if(match(_raw, "^~[^,]+,\d{10}\.\d{1,9}(,|$)") AND tonumber(replace(_raw, "^~[^,]+,(\d{10})\.\d{1,9}(,[\s\S]*)?$", "\1")) >= time() - 2000*86400 AND tonumber(replace(_raw, "^~[^,]+,(\d{10})\.\d{1,9}(,[\s\S]*)?$", "\1")) <= time() + 2*86400, tonumber(replace(_raw, "^~[^,]+,(\d{10}\.\d{1,9})(,[\s\S]*)?$", "\1")), _time)))


# Index time for template records (sourcetype tenx_dml_raw_json), whatever time the sender
# gave them. See props.conf [tenx_dml_raw_json]. The one assignment, as in tenx-event-time.
[tenx-dml-time]
INGEST_EVAL = _time=time()


# A compact event that a Universal Forwarder reads from a Receiver's relay file (README, "Universal
# Forwarder Relay Lines"). Fluent Bit's file output with Format out_file writes each record the Receiver
# returns as "<tag>: [<seconds>.<nanoseconds>, <record as JSON>]". This rule makes the line that record,
# with the time first as "time": seconds and six fraction digits, cut as tenx-event-time cuts them.
# tenx-record-unwrap then reads it as it reads a heavy forwarder's line. A line that starts with "{" or
# does not end with "}]" is left as it is.
[tenx-relay-line]
INGEST_EVAL = _raw=if(match(_raw, "^[^{\s]\S*?: \[(\d+)\.(\d{6})\d{3}, \{([\s\S]+)\}\]$"), replace(_raw, "^[^{\s]\S*?: \[(\d+)\.(\d{6})\d{3}, \{([\s\S]+)\}\]$", "{" . urldecode("%22") . "time" . urldecode("%22") . ":\1.\2,\3}"), _raw)


# A compact event that a heavy forwarder reads back from a file (README, "Receiver Beside a Heavy
# Forwarder"). Fluent Bit's file output with Format plain writes each record the Receiver returns as one
# JSON object per line: time, event, host, source, sourcetype and index, as the heavy forwarder's ingest
# actions file destination wrote them. This rule puts host, source and index back on the event; sets
# _time from the line's time and marks it tenx_time=sender, so tenx-event-time keeps it; writes the
# original sourcetype as the indexed field tenx_sourcetype, or keeps the one the event has when the line
# names none (a Universal Forwarder's _meta); adds the line's "meta" text, the Receiver's compactFields in
# the text form with the separator ::, to the event's indexed fields; and makes the compact text _raw. A
# line without "event" keeps its text and is marked tenx_unwrap=failed. props.conf runs it, after
# tenx-relay-line, only on the files of the folder these lines are written to.
#
# tonumber(tostring(...)): tonumber() straight on json_extract() of a JSON number drops the fraction
# (Splunk Enterprise 10.4.3: .000000 for a time written to the microsecond); through tostring() the
# fraction is kept.
[tenx-record-unwrap]
INGEST_EVAL = host=if(isnotnull(json_extract(_raw, "host")), json_extract(_raw, "host"), host), source=if(isnotnull(json_extract(_raw, "source")), json_extract(_raw, "source"), source), index=if(isnotnull(json_extract(_raw, "index")), json_extract(_raw, "index"), index), tenx_sourcetype:=coalesce(json_extract(_raw, "sourcetype"), tenx_sourcetype), tenx_time:=if(isnotnull(json_extract(_raw, "time")), "sender", null()), _time=if(isnotnull(json_extract(_raw, "time")), tonumber(tostring(json_extract(_raw, "time"))), _time), tenx_unwrap:=if(isnull(json_extract(_raw, "event")), "failed", null()), _meta=if(isnotnull(json_extract(_raw, "meta")), coalesce(_meta, "") . " " . json_extract(_raw, "meta"), _meta), _raw=if(isnotnull(json_extract(_raw, "event")), json_extract(_raw, "event"), _raw)


# Indexes a compact event under its original sourcetype, the first value of tenx_sourcetype, so that
# the event types, tags and data models of that sourcetype read it. Nothing calls it as shipped. Turn
# it on where the events are parsed, in a local props.conf stanza for tenx_encoded or for the source or
# host of the compact events:
#     TRANSFORMS-tenx_type = tenx-original-sourcetype
# The class tenx_type sorts after 00_tenx_unwrap and tenx_time, so it runs after them, on an event parsed
# as tenx_encoded. Turn it on only for sources whose Receiver attaches the fields that the add-on's event
# types and models read: without them such an event can count in a model with those fields empty.
[tenx-original-sourcetype]
INGEST_EVAL = sourcetype=if(len(mvindex(tenx_sourcetype, 0)) > 0, mvindex(tenx_sourcetype, 0), sourcetype)


# dest from the Computer field, for Windows Security events in the XML form (props.conf
# [source::XmlWinEventLog:Security]).
[tenx-computer-as-dest]
SOURCE_KEY = Computer
REGEX = ^(.+)$
FORMAT = dest::$1
