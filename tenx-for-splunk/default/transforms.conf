
# Lookup definition for getting processed 10x pattern parts needed for decoding 10x encoded events.
#
# See macros.conf for more info.
#
[tenx-dml-lookup]
case_sensitive_match = true
collection = tenx_dml
external_type = kvstore
fields_list = _key,pattern_hash,pattern,pattern_parts,part_0,pattern_terminator,timestamp_format,expand_unsafe,pattern_search,search_copy


# Extraction on encoded 10x events to prep them for decoding.
#
# See macros.conf for more info.
#
# Format: ~<hash>,<var0>,<var1>,...  (comma-delimited with ~ prefix), or ~<hash> alone for a
# template with no values. Hash may contain spaces and special characters, so we only split
# on commas.
#
[tenx-hash-vars-extraction]
REGEX = ^~?(?<tenx_hash>[^,]+)(?:,(?<tenx_var_0>[^,]+)(?:,(?<tenx_vars>.*))?)?


# Event time for compact events, set while the event is parsed.
#
# A template with a timestamp slot stores the timestamp as the event's first variable, an
# epoch of 13 digits (milliseconds) or 19 (nanoseconds). Where the first variable has that
# shape and falls inside Splunk's own default window for a timestamp, 2,000 days back and 2
# days ahead, _time is set from it: whole seconds from the first 10 digits and up to 6
# fraction digits from the rest, so no 19-digit value passes through floating point.
# Anything else keeps the time DATETIME_CONFIG gave it, the index time. The two working
# fields are removed in the same expression, so nothing is added to the index.
#
[tenx-event-time]
INGEST_EVAL = tenx_t_epoch=if(match(_raw, "^~?[^,]+,(\d{13}|\d{19})(,|$)"), replace(_raw, "^~?[^,]+,(\d+)(,[\s\S]*)?$", "\1"), null()), tenx_t_sec=tonumber(substr(tenx_t_epoch, 1, 10)) + tonumber("0." . substr(tenx_t_epoch, 11, 6)), _time=if(isnotnull(tenx_t_sec) AND tenx_t_sec >= time() - 2000*86400 AND tenx_t_sec <= time() + 2*86400, tenx_t_sec, _time), tenx_t_epoch:=null(), tenx_t_sec:=null()
