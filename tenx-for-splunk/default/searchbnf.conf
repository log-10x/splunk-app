
# BNF definition for the tenxsearch generating python command.
# See tenxsearch.py for more details.
#
[tenxsearch-command]
syntax = tenxsearch [searchstring=<string>]
shortdesc = Command to wrap a standard splunk search with 10x decoding capabilities.
usage = public

# BNF definition for the tx generating python command, the tenxsearch command with the search
# written as its arguments. See tx.py.
#
[tx-command]
syntax = tx <search>
shortdesc = Searches compact events, with the search written as it would be on the original data.
usage = public
example1 = | tx index=app_logs sourcetype=tenx_encoded "connection refused" NOT retry
comment1 = Searches the compact events of sourcetype tenx_encoded in app_logs for the phrase, as the same search would on the original lines.
