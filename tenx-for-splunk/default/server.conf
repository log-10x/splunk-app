
# Search head clustering: the app's own configuration file is a custom conf, and custom
# confs do not replicate across cluster members unless they are named here. Without this
# a captain-side change to tenx_config.conf would not reach the other members, and the
# app would decode differently depending on which member served the search.
#
[shclustering]
conf_replication_include.tenx_config = true
