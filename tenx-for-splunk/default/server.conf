# Search head clustering: the app's own configuration files are custom confs, and custom
# confs do not replicate across cluster members unless they are named here. Without this
# a captain-side change to tenx_config.conf would not reach the other members, and the
# app would decode differently depending on which member served the search. tenx_replay.conf
# (written by tenxreplay) tells the search rewrite which field replay a search needs; without
# it a member that did not run the rebuild would replay nothing in the rewrite.
#
[shclustering]
conf_replication_include.tenx_config = true
conf_replication_include.tenx_replay = true
