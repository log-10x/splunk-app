
# Alert for populating the 'tenx_dml_pure' sourcetype and 'tenx_dml' collection needed
# by the 10x application to decode 10x encoded data.
#
# See savedsearches.conf for more info.
#
[tenx_dml_to_kv]
is_custom = 1
label = Fill KV store from DML
payload_format = json
disabled = 0
python.version = python3
python.required = 3.13
icon_path = kv_alert.png
# The event search that finds template records (see savedsearches.conf [Consume KV]).
param.source = index=tenx_dml sourcetype=tenx_dml_raw_json
# An index time (epoch seconds) to load template records from, instead of the checkpoint; 0 for
# all. Empty: from the checkpoint.
param.from =
