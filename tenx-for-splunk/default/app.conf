#
# Splunk app configuration file
#

[install]
is_configured = 0
# Splunk 10.2 deprecates python.version in favour of python.required, which takes a
# comma-separated list and selects the highest version present on the platform.
# Splunk 10.1 and earlier ignore python.required and read python.version, so both are
# carried while this app supports 9.4 through 10.4.
#
# 3.13 rather than 3.9: AppInspect deprecates 3.9 as well, and the app is exercised on
# 3.13 by tests/live_endpoints.py against Splunk 10.4.3, whose own interpreter is 3.13.
python.version = python3
python.required = 3.13

[ui]
is_visible = 1
label = 10x for Splunk

[launcher]
author = Log10x
description = Log10x log optimization for Splunk
version = 1.0.0

[triggers]
reload.tenx_config = simple

[package]
id = tenx-for-splunk
# Explicit rather than defaulted: a private, unlisted app sets this false, and this one is
# published, so it stays true.
check_for_updates = true

# Required for installation. check_for_valid_package_id and check_version_is_valid_semver
# both read the name here, not the one in [package].
[id]
name = tenx-for-splunk
version = 1.0.0
