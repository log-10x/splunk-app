
# A periodic search job which is responsible for automatically filling the 'pure' dml sourcetype
# and the tenx_dml collection with the necessary data for 10x decoding.
#
# Input -
# The 'tenx_dml_raw_json' sourcetype, which should contain json events matching the structure of
# {"templateHash":"<hash_value>", "template":"<template_value>"}
#
# Output -
# The 'tenx_dml_pure' sourcetype, which will contain a simplified non-json string events with
# a structure "<hash_value> <modified_template_value>"
# This sourcetype is used for finding the hashes matching specific user searches, so <modified_template_value>
# is the original <template_value>, but with new-lines and the 10x variable separators removed,
# as those don't add any useful information for the search.
#
# Output -
# The 'tenx_dml' collection, which will contain a modified structure of the <template_value> which
# the 10x decoding macro utilizes when decoding events.
#
# For more details, see:
# tenx_dml_to_kv.py - The python code invoked by this alert which does all the above input -> output.
# alert_actions.conf - The definition of the alert action invoking the python code.
# collections.conf - The definition of the 'tenx_dml' collection.
# macros.conf - The definition of the decoding macro.
# props.conf - The definitions of the sourcetypes.
# transforms.conf - The definition of the lookup on the 'tenx_dml' collection.
# 
[Consume KV]
action.tenx_dml_to_kv = 1
alert.digest_mode = 1
alert.expires = 10h
alert.suppress = 0
alert.track = 0
# Every five minutes the alert action stores every template record indexed since the last
# record it stored. The search only starts it: `| makeresults` returns one result, so the action
# runs on every run, also after an outage, when no new record arrives. The action keeps how far
# it has loaded, by index time, in the tenx_kv_state collection and reads the records itself
# (search/jobs/export, in slices of index time), so no result cap or window of this search
# limits what it stores; a run that stops is resumed by the next one. Its first run, after an
# install or an upgrade, reads every template record in the index. The search that finds the
# records is the action's `source` parameter (alert_actions.conf); set it here to read them
# from another index:
#   action.tenx_dml_to_kv.param.source = index=my_template_index sourcetype=tenx_dml_raw_json
#
# AppInspect rejects a schedule over twelve runs an hour, and Cloud reviewers read a tighter one
# as load.
cron_schedule = */5 * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
request.ui_dispatch_app = tenx-for-splunk
request.ui_dispatch_view = search
search = | makeresults
counttype = number of events
quantity = 0
relation = greater than


# The same alert action from the start of the index, unscheduled: it reads every template record
# again and stores what the KV store lacks, after the collection was emptied or restored from an
# older backup. Records already stored are read and left as they are.
#
# The Run button does not fire the alert action; run it with sendalert, as an admin or power user:
#   | makeresults | sendalert tenx_dml_to_kv param.from=0
#
# A search that returns template records can also be piped to the action, which stores exactly
# those records:
#   index=tenx_dml sourcetype=tenx_dml_raw_json earliest=-30d | sendalert tenx_dml_to_kv
#
[Backfill KV]
action.tenx_dml_to_kv = 1
action.tenx_dml_to_kv.param.from = 0
alert.digest_mode = 1
alert.expires = 10h
alert.suppress = 0
alert.track = 0
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 0
request.ui_dispatch_app = tenx-for-splunk
request.ui_dispatch_view = search
search = | makeresults
counttype = number of events
quantity = 0
relation = greater than


# Templates indexed against templates stored: every template hash in the template records indexed
# more than ten minutes ago, and how many of them the KV store holds. A template counted missing
# has events that stay compact through `tx` and `txf`. Diagnostics shows it.
#
[Template Store Gap]
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 0
request.ui_dispatch_app = tenx-for-splunk
request.ui_dispatch_view = search
search = index=tenx_dml sourcetype=tenx_dml_raw_json _index_latest=-10m | eval tenx_key=trim(templateHash) | stats count by tenx_key | lookup tenx-dml-lookup _key AS tenx_key OUTPUT pattern_hash AS tenx_stored | stats count as indexed, count(tenx_stored) as stored | eval missing=indexed-stored


# Recompiles every alert made in the Compile Alert view (or through /tenx-alert), for every
# user. A compiled alert selects compact events by the templates that matched its words when
# it was compiled; a template that appears later, such as a new log statement after a deploy,
# is picked up at the next run. An alert is rewritten only when its compiled search changed,
# never when a person edited it by hand, and never with a result that needs review.
#
[Recompile Compiled Alerts]
cron_schedule = 2-59/15 * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
search = | tenxrecompile

# Rewrites the tenx-replay macro, which `txf` runs after expanding, from the props of the
# original sourcetypes of the compact events indexed in the last 7 days, whatever their event
# dates (by_index_time: the time range is index time, read over all event time). It writes
# nothing when nothing changed, and with skip_unchanged it rebuilds only when something it reads
# changed since its last rebuild, or on a new day. See tenxreplay.py.
[Rebuild Field Replay]
cron_schedule = 7 * * * *
dispatch.earliest_time = -7d
dispatch.latest_time = now
enableSched = 1
search = | tenxreplay by_index_time=true skip_unchanged=true

# Rebuilds the replay within minutes when compact events carry an original sourcetype, or a
# sourcetype with a source, host or index, that it does not cover yet. Otherwise it runs one
# tstats over the compact events indexed in the last ten minutes, of any event date, and writes
# nothing. When it changes what the search rewrite
# chooses for an index, it dispatches "Recompile Compiled Alerts" so compiled alerts on that index
# get the new text then, not at the next quarter hour. See tenxreplay.py.
[Rebuild Field Replay When New]
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
search = | tenxreplay only_new=true by_index_time=true
