
# A periodic search job which is responsible for automatically filling the 'pure' dml sourcetype
# and the tenx_dml collection with the necessary data for 10x decoding.
#
# Input -
# The 'tenx_dml_raw_json' sourcetype, which should contain json events matching the structure of
# {"templateHash":"<hash_value>", "template":"<template_value>"}
#
# Output -
# The 'tenx_dml_pure' sourcetype, which will contain a simplified non-json string events with
# a structure "<hash_value> <modified_template_value>"
# This sourcetype is used for finding the hashes matching specific user searches, so <modified_template_value>
# is the original <template_value>, but with new-lines and the 10x variable separators removed,
# as those don't add any useful information for the search.
#
# Output -
# The 'tenx_dml' collection, which will contain a modified structure of the <template_value> which
# the 10x decoding macro utilizes when decoding events.
#
# For more details, see:
# tenx_dml_to_kv.py - The python code invoked by this alert which does all the above input -> output.
# alert_actions.conf - The definition of the alert action invoking the python code.
# collections.conf - The definition of the 'tenx_dml' collection.
# macros.conf - The definition of the decoding macro.
# props.conf - The definitions of the sourcetypes.
# transforms.conf - The definition of the lookup on the 'tenx_dml' collection.
# 
[Consume KV]
action.tenx_dml_to_kv = 1
alert.digest_mode = 1
alert.expires = 10h
alert.suppress = 0
alert.track = 0
# Every five minutes, looking back seven. AppInspect rejects a schedule over twelve runs
# an hour, and Cloud reviewers read a tighter one as load. The window has to stay wider
# than the interval or a template that arrives between two runs is never stored, so the
# two are changed together and the overlap is deliberate. Storing a template twice costs
# nothing: the alert skips a hash the collection already holds.
cron_schedule = */5 * * * *
dispatch.earliest_time = -7m
dispatch.latest_time = now
enableSched = 1
request.ui_dispatch_app = tenx-for-splunk
request.ui_dispatch_view = search
search = index=tenx_dml sourcetype=tenx_dml_raw_json
counttype = number of events
quantity = 0
relation = greater than


# The same alert action over a wide window, unscheduled, for the two cases the periodic
# search above cannot cover.
#
# A template is only stored if the scheduled search above is running when it arrives. If
# compact events reached this instance before the app was installed, or that search was
# disabled or failing for longer than its window, those template events are already
# indexed and nothing rescans them, so the KV store never learns them and their events
# never expand. Whether the Receiver would send the same template again is a property of
# the Receiver, not of this app, so this search does not assume it will.
#
# Run it after installing the app, and after any outage of the search above, as an admin or
# power user. The Run button does not fire the alert action; run the search with sendalert:
#   index=tenx_dml sourcetype=tenx_dml_raw_json earliest=-30d | sendalert tenx_dml_to_kv
# It is idempotent: a hash the collection already holds is skipped.
#
[Backfill KV]
action.tenx_dml_to_kv = 1
alert.digest_mode = 1
alert.expires = 10h
alert.suppress = 0
alert.track = 0
dispatch.earliest_time = -30d
dispatch.latest_time = now
enableSched = 0
request.ui_dispatch_app = tenx-for-splunk
request.ui_dispatch_view = search
search = index=tenx_dml sourcetype=tenx_dml_raw_json
counttype = number of events
quantity = 0
relation = greater than


# Recompiles every alert made in the Compile Alert view (or through /tenx-alert), for every
# user. A compiled alert selects compact events by the templates that matched its words when
# it was compiled; a template that appears later, such as a new log statement after a deploy,
# is picked up at the next run. An alert is rewritten only when its compiled search changed,
# never when a person edited it by hand, and never with a result that needs review.
#
[Recompile Compiled Alerts]
cron_schedule = 2-59/15 * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
search = | tenxrecompile
