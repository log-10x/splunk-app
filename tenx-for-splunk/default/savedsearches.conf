
# A periodic search job which is responsible for automatically filling the 'pure' dml sourcetype
# and the tenx_dml collection with the necessary data for 10x decoding.
#
# Input -
# The 'tenx_dml_raw_json' sourcetype, which should contain json events matching the structure of
# {"templateHash":"<hash_value>", "template":"<template_value>"}
#
# Output -
# The 'tenx_dml_pure' sourcetype, which will contain a simplified non-json string events with
# a structure "<hash_value> <modified_template_value>"
# This sourcetype is used for finding the hashes matching specific user searches, so <modified_template_value>
# is the original <template_value>, but with new-lines and the 10x variable separators removed,
# as those don't add any useful information for the search.
#
# Output -
# The 'tenx_dml' collection, which will contain a modified structure of the <template_value> which
# the 10x decoding macro utilizes when decoding events.
#
# For more details, see:
# tenx_dml_to_kv.py - The python code invoked by this alert which does all the above input -> output.
# alert_actions.conf - The definition of the alert action invoking the python code.
# collections.conf - The definition of the 'tenx_dml' collection.
# macros.conf - The definition of the decoding macro.
# props.conf - The definitions of the sourcetypes.
# transforms.conf - The definition of the lookup on the 'tenx_dml' collection.
# 
[Consume KV]
action.tenx_dml_to_kv = 1
alert.digest_mode = 1
alert.expires = 10h
alert.suppress = 0
alert.track = 0
# Every five minutes, looking back seven. AppInspect rejects a schedule over twelve runs
# an hour, and Cloud reviewers read a tighter one as load. The window has to stay wider
# than the interval or a template that arrives between two runs is never stored, so the
# two are changed together and the overlap is deliberate. Storing a template twice costs
# nothing: the alert skips a hash the collection already holds.
#
# The seven minutes are of index time (_index_earliest), so a record is stored in the first
# run after it is indexed whatever time it carries. props.conf gives every template record
# the time it is parsed (tenx-dml-time), but a record parsed on a heavy forwarder and held
# there while the indexers were unreachable reaches the index later than that time. The
# event-time window of a day is what the search reads buckets for. Measured on Splunk
# Enterprise 10.4.3 with 200 records just indexed among 17,853: index time over all event
# time read the 200 records only (scanCount 200, 0.26 s), as fast as the event-time window
# alone; every record of the sourcetype over all time read 17,853 (0.54 s).
cron_schedule = */5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
request.ui_dispatch_app = tenx-for-splunk
request.ui_dispatch_view = search
search = index=tenx_dml sourcetype=tenx_dml_raw_json _index_earliest=-7m _index_latest=now
counttype = number of events
quantity = 0
relation = greater than


# The same alert action over a wide window, unscheduled, for the two cases the periodic
# search above cannot cover.
#
# A template is only stored if the scheduled search above is running when it arrives. If
# compact events reached this instance before the app was installed, or that search was
# disabled or failing for longer than its window, those template events are already
# indexed and nothing rescans them, so the KV store never learns them and their events
# never expand. Whether the Receiver would send the same template again is a property of
# the Receiver, not of this app, so this search does not assume it will.
#
# Run it after installing the app, and after any outage of the search above, as an admin or
# power user. The Run button does not fire the alert action; run the search with sendalert:
#   index=tenx_dml sourcetype=tenx_dml_raw_json earliest=-30d | sendalert tenx_dml_to_kv
# It is idempotent: a hash the collection already holds is skipped.
#
# A template record takes the time it is parsed (props.conf, tenx-dml-time), so the thirty
# days are thirty days of arrival. A record indexed by an earlier version of the app kept the
# time its sender gave it, which over HEC is the time of the event that made the template and
# can be years old; to load those, run the search above with earliest=0.
#
[Backfill KV]
action.tenx_dml_to_kv = 1
alert.digest_mode = 1
alert.expires = 10h
alert.suppress = 0
alert.track = 0
dispatch.earliest_time = -30d
dispatch.latest_time = now
enableSched = 0
request.ui_dispatch_app = tenx-for-splunk
request.ui_dispatch_view = search
search = index=tenx_dml sourcetype=tenx_dml_raw_json
counttype = number of events
quantity = 0
relation = greater than


# Recompiles every alert made in the Compile Alert view (or through /tenx-alert), for every
# user. A compiled alert selects compact events by the templates that matched its words when
# it was compiled; a template that appears later, such as a new log statement after a deploy,
# is picked up at the next run. An alert is rewritten only when its compiled search changed,
# never when a person edited it by hand, and never with a result that needs review.
#
[Recompile Compiled Alerts]
cron_schedule = 2-59/15 * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
search = | tenxrecompile

# Rewrites the tenx-replay macro, which `txf` runs after expanding, from the props of the
# original sourcetypes of the compact events indexed in the last 7 days, whatever their event
# dates (by_index_time: the time range is index time, read over all event time). It writes
# nothing when nothing changed. See tenxreplay.py.
[Rebuild Field Replay]
cron_schedule = 7 * * * *
dispatch.earliest_time = -7d
dispatch.latest_time = now
enableSched = 1
search = | tenxreplay by_index_time=true

# Rebuilds the replay within minutes when compact events carry an original sourcetype, or a
# sourcetype with a source, host or index, that it does not cover yet. Otherwise it runs one
# tstats over the compact events indexed in the last ten minutes, of any event date, and writes
# nothing. When it changes what the search rewrite
# chooses for an index, it dispatches "Recompile Compiled Alerts" so compiled alerts on that index
# get the new text then, not at the next quarter hour. See tenxreplay.py.
[Rebuild Field Replay When New]
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
search = | tenxreplay only_new=true by_index_time=true

# Compact events the index-time field map (tenx_field_map.py --rules lookup) indexed without their
# fields in the last 15 minutes, by index, sourcetype and reason (tenx_unmapped: no_row, the lookup
# file has no row for the template; bad_row, the row cannot be used; no_match, the event does not have
# the row's values; no_table, the floor copy of the file answered because the field map's own file is
# missing), plus index-time rule errors in splunkd.log by sourcetype, which drop the event they occur
# on. The 15 minutes are index time, read over every event date (the dispatch range is all time, the
# tstats terms _index_earliest and _index_latest select): a compact event keeps its original date, so
# events dated earlier than the last 15 minutes are counted when they are indexed. The probe events of
# tenx_field_map.py activate and check (host tenx-fm-probe) are left out.
# Unscheduled, as it is useful only where a field map is installed: enable the schedule there and
# add an alert action. It counts nothing on an instance without a field map.
[Field Map Events Without Fields]
alert.digest_mode = 1
alert.expires = 24h
alert.suppress = 0
alert.track = 1
cron_schedule = */15 * * * *
dispatch.earliest_time = 0
dispatch.latest_time = +10y
enableSched = 0
request.ui_dispatch_app = tenx-for-splunk
request.ui_dispatch_view = search
search = | tstats count where index=* tenx_unmapped=* NOT host=tenx-fm-probe _index_earliest=-15m _index_latest=now by index sourcetype tenx_unmapped | append [search index=_internal earliest=-15m latest=now sourcetype=splunkd component=pipeline "processor=regexreplacement" "Runtime exception" | rex "confkey='[^']*\|(?<sourcetype>[^|']*)\|'" | stats count by sourcetype | eval index="(dropped)", tenx_unmapped="index-time rule error"] | where count > 0
counttype = number of events
quantity = 0
relation = greater than

# Compact events Splunk dropped while it parsed them because a field map's index-time lookup() failed: a lookup
# file Splunk finds but cannot load (the user Splunk runs as cannot read it, it is not gzip, it has no hash
# column) throws in that rule, and Splunk drops the event and writes one splunkd.log line for it on the node
# that parsed it, the event's sourcetype at the end of its confkey (Splunk Enterprise 10.4.3: 2 lines for 2
# dropped events, for each of the three cases). Read from _internal, so every parsing node that forwards its
# own logs is counted, and kept to the compact sourcetypes of field maps (a props stanza with rename and a
# TRANSFORMS- class *_fields_eval, as tenx_field_map.py gen writes them), one row per node and sourcetype with
# the count and the first and last time. Scheduled and tracked as a triggered alert by default; it counts
# nothing where no field map is installed. tenx_field_map.py check reads the same lines and empties the list.
[Field Map Dropped Events]
alert.digest_mode = 1
alert.expires = 7d
alert.severity = 5
alert.suppress = 0
alert.track = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
enableSched = 1
request.ui_dispatch_app = tenx-for-splunk
request.ui_dispatch_view = search
search = index=_internal sourcetype=splunkd "Runtime exception" "processor=regexreplacement" | rex "confkey='[^']*\|(?<compact_sourcetype>[^|']+)\|'" | search [| rest splunk_server=local count=0 /servicesNS/-/-/configs/conf-props | where isnotnull(rename) | foreach TRANSFORMS-* [eval tenx_fm=if(match('<<FIELD>>', "_fields_eval"), 1, tenx_fm)] | where tenx_fm=1 | stats count by title | rename title AS compact_sourcetype | fields compact_sourcetype | append [| makeresults | eval compact_sourcetype="tenx-no-field-map" | fields compact_sourcetype]] | stats count AS dropped_events, min(_time) AS first, max(_time) AS last BY host, compact_sourcetype | eval first=strftime(first, "%F %T %z"), last=strftime(last, "%F %T %z")
counttype = number of events
quantity = 0
relation = greater than
