# Where the compact events are, for the app's own dashboards. The setup guide leaves the
# index and the sourcetype of compact events to the deployment, so no fixed name can be
# right: edit this definition to your compact index and sourcetype (Settings > Advanced
# search > Search macros). The default finds the app's own sourcetype in every index the
# searcher can read, which works out of the box and is slower than naming the index.
# Add each sourcetype you register for compact events here as well:
#     index=my_compact_index (sourcetype::tenx_encoded OR sourcetype::my_other_sourcetype)
# The indexed-field form (sourcetype::) is used because `tx` adds a prefilter of many
# terms to this clause, and beside such a prefilter Splunk 10.4.3 dropped a few events
# matched with sourcetype=.
#
[tenx-events]
definition = index=* sourcetype::tenx_encoded

# Raw events of the same sources, for `tx` and `txf` to return as they are: a source that sent raw
# events before the Receiver was installed (or a host that still sends raw) has them in the same
# indexes as its compact events, and a search over both periods needs both. `tx` and `txf` read
# (`tenx-events`) OR (this), so each event comes once; the events this selects are not expanded and
# keep the fields Splunk gave them when it read them (tenx_passed, see tenx-whole-hide). The shipped
# definition selects no event. Name the raw events by index and sourcetype, in the indexed-field form
# used in tenx-events:
#     index=my_index (sourcetype::access_combined OR sourcetype::fortigate_traffic)
# Only `tx` and `txf` read this macro; the dashboards, the field replay and the template checks read
# tenx-events, so they still count compact events alone. When the indexes a `tx` search reads hold raw
# events of the original sourcetypes of its compact events that this does not name, the search shows a
# warning (bin/tenx_prefilter.py; it needs the sender to set tenx_sourcetype).
#
[tenx-raw-events]
definition = sourcetype::tenx_no_raw_events

# Macro for displaying a message as a search result.
# Simply appends a new synthetic event to an empty search.
#
[tenx-message(1)]
args = term
definition = search tenxsearchstringthatneverhits | append [| makeresults | eval _raw="$term$"]

# Where the searchable copies of the templates are, for `tx`. The index is the app's
# dest_dml_index; edit this definition together with it.
#
[tenx-templates]
definition = index=tenx_dml (sourcetype=tenx_dml_pure OR source=tenx_dml_pure)

# Search compact events by what the original lines say: write `tx` in front of an ordinary
# search, after the index and any metadata or time terms.
#
#     index=app_logs earliest=-1h `tx` "payment failed" status=500 | stats count by host
#
# The words after `tx` are the arguments of the final search, applied to the expanded
# text, so phrases, field=value, IN, TERM(), CASE(), NOT, OR and parentheses behave as on
# the original lines. The subsearch builds the prefilter that chooses which compact events
# to expand: see bin/tenx_prefilter.py and bin/tenx_prefilter_parser.py. Time modifiers go
# before `tx`; after it they would match nothing, and the search stops with an error.
# Splunk marks a compact event as already extracted (_kv), so `fields - _kv` lets
# `extract` run the sourcetype's own field extraction, JSON included, on the expanded text.
# An event indexed with a field map (bin/tenx_field_map.py) already carries its fields as
# indexed fields and is hidden from that `extract` (tenx-mapped-hide, tenx-mapped-restore).
# So is an event the sender passed whole (text that is not compact, marked tenx_passed before the
# expansion): Splunk extracted its fields when it read it, and `extract` would add each JSON
# field a second value (tenx-whole-hide, tenx-whole-restore).
# The template lookup gives tenx_expand_refused an empty value on every event it expands; the
# last eval removes that, so only an event that was not expanded carries the field, with the
# reason (see tenx-inflate).
#
[tx]
definition = ((`tenx-events`) OR (`tenx-raw-events`)) [| tenxprefilter] | eval tenx_passed=if(match(_raw, "^~"), null(), 1) | `tenx-inflate` | `tenx-mapped-hide` | `tenx-whole-hide` | fields - _kv | extract | `tenx-whole-restore` | `tenx-mapped-restore` | fields - tenx_hash, tenx_var_0, tenx_vars | eval tenx_expand_refused=if(len(tenx_expand_refused)>0, tenx_expand_refused, null()) | `tenx-wild` | search *

# The step before the final search of `tx` and `txf`. A word with a wildcard inside it
# (Se*Privilege), and TERM() or CASE() of some words, match other events in that final search,
# after a pipe, than the same search on the index (Se*Privilege is matched as its prefix alone).
# The prefilter (bin/tenx_prefilter.py) stores on the job, for such words only, the regular
# expressions that find each word as the index does (custom.tenx_wild_marks: 0:<regex>,1:<regex>,...,
# each percent-encoded) and the words with each one replaced by its mark (custom.tenx_wild_search:
# tenx_w=0, tenx_w=1, ...). Each subsearch here reads one of them back from the job that runs the
# search: its own name is subsearch_<that job's name>_<epoch>.<n>, and map passes that name to rest.
# fillnull puts the marks on every event as tenx_wild, and the eval sets tenx_w to the numbers of the
# expressions the event's text matches. Where nothing is stored, or the job cannot be read, tenx_wild
# is "-", the eval marks nothing and the search is `*`. The final search still applies every word,
# so a word under NOT keeps what it excludes there.
# Splunk's union checks the commands of each of its datasets before it runs the subsearches inside
# them, and there eval, where and rex refuse a subsearch as their argument ("The expression is
# malformed", Splunk Enterprise 10.4.3); search and fillnull accept one, so this step has no
# subsearch inside eval.
#
[tenx-wild]
definition = fillnull [| makeresults | addinfo | eval p=replace(info_sid, "^subsearch_(.+)_\d+\.\d+$", "\1") | where p!=info_sid AND NOT match(p, "^nested_") | map maxsearches=1 search="| rest /services/search/jobs/$p$ splunk_server=local | fields custom.tenx_wild_marks" | appendpipe [stats count | where count=0] | eval search="value=\"" . coalesce('custom.tenx_wild_marks', "-") . "\"" | fields search] tenx_wild | eval tenx_wild=if(tenx_wild=="-", null(), split(tenx_wild, ",")), tenx_w=mvmap(tenx_wild, if(match(_raw, urldecode(replace(tenx_wild, "^\d+:", ""))), replace(tenx_wild, ":[\s\S]*$", ""), null())) | search [| makeresults | addinfo | eval p=replace(info_sid, "^subsearch_(.+)_\d+\.\d+$", "\1") | where p!=info_sid AND NOT match(p, "^nested_") | map maxsearches=1 search="| rest /services/search/jobs/$p$ splunk_server=local | fields custom.tenx_wild_search" | appendpipe [stats count | where count=0] | eval search=coalesce('custom.tenx_wild_search', "*") | fields search] | fields - tenx_w*

# `tx` with the original sourcetype's search-time fields: aliases, calculated fields, lookups,
# event types and tags as well as extractions. Written and read like `tx`:
#
#     index=wineventlog `txf(XmlWinEventLog)` EventCode=4625 action=failure
#     index=wineventlog `txf` tag=authentication
#
# It applies to a compact event whose sender set the indexed field tenx_sourcetype to the
# event's original sourcetype (`fields` in an HEC event, `_meta = tenx_sourcetype::<name>` in
# inputs.conf). Every other event is expanded and extracted exactly as by `tx`. The `tenxreplay`
# command (the "Rebuild Field Replay" saved searches) writes the replay from this instance's
# props for the original sourcetypes present; see bin/tenx_replay_builder.py.
#
# Splunk reads the whole text of a macro on every search that uses it, even one that finds no
# event (about 0.012 s per 1,000 characters, observed on Splunk Enterprise 10.4.3), so `tx`
# carries none of this, and txf carries as little as the search asks for:
#
#   `txf(<sourcetype>)`  only that sourcetype's rules: its own props stanza, [default], and the
#                        source:: and host:: stanzas matching a source or host the replay has
#                        recorded for it. Events of other sourcetypes are handled as by `tx`.
#                        It calls that sourcetype's macro tenx-replay-u<first 12 hex digits of
#                        md5(<sourcetype>)>, which tenxreplay writes for each sourcetype it
#                        covers: a macro name may hold only letters, digits, _ and - (Splunk
#                        10.4.3 refuses `tenx-replay-st-app:kv`), so the name is computed in
#                        eval (iseval). Its validation also requires a unit written for the
#                        sourcetype: tenxreplay rewrites it with the units it has written, so
#                        for a sourcetype without one the search stops while Splunk parses it,
#                        with a message saying how to write one (a check there reaches every
#                        client, the REST export endpoint included). The shipped validation
#                        names no unit. The name without quotes.
#   `txf`                every covered sourcetype and every source:: and host:: stanza with a rule
#                        (the tenx-replay macro). The largest text, so the slowest to start.
#
# The compact text is kept in tenx_compact_raw until the replay has read it, so the replay can
# tell which events were expanded. As in `tx`, an empty tenx_expand_refused is removed last.
#
[txf]
definition = ((`tenx-events`) OR (`tenx-raw-events`)) [| tenxprefilter] | eval tenx_compact_raw=_raw, tenx_passed=if(match(_raw, "^~") OR isnotnull(tenx_sourcetype), null(), 1) | `tenx-inflate` | fields - _kv | `tenx-mapped-hide` | `tenx-whole-hide` | `tenx-replay` | `tenx-whole-restore` | `tenx-mapped-restore` | fields - tenx_compact_raw, tenx_rst, tenx_hash, tenx_var_0, tenx_vars | eval tenx_expand_refused=if(len(tenx_expand_refused)>0, tenx_expand_refused, null()) | `tenx-wild` | search *

[txf(1)]
args = st
iseval = 1
validation = match(st, "^[A-Za-z0-9_.:/-]+$") AND like("||", "%|" . substr(md5(st), 1, 12) . "|%")
errormsg = no field replay is written yet for this sourcetype, so the search was not run. Rebuild Field Replay When New writes one within five minutes of the sourcetype's first compact event being indexed; to write it now, run | tenxreplay over All time. txf takes one original sourcetype, without quotes (letters, digits and _ . : / -)
definition = "((`tenx-events`) OR (`tenx-raw-events`)) [| tenxprefilter] | eval tenx_compact_raw=_raw, tenx_passed=if(match(_raw, \"^~\") OR isnotnull(tenx_sourcetype), null(), 1) | `tenx-inflate` | fields - _kv | `tenx-mapped-hide` | `tenx-whole-hide` | `tenx-replay-u" . substr(md5("$st$"), 1, 12) . "` | `tenx-replay-tags` | `tenx-whole-restore` | `tenx-mapped-restore` | fields - tenx_compact_raw, tenx_rst, tenx_hash, tenx_var_0, tenx_vars | eval tenx_expand_refused=if(len(tenx_expand_refused)>0, tenx_expand_refused, null()) | `tenx-wild` | search *"

# The search-time fields of an expanded event, for `txf` and the search rewrite. Splunk marks a
# compact event as already extracted (_kv), so `txf` drops the mark first (`fields - _kv`) and
# `extract` then runs the event's own field extraction, JSON included, on the expanded text.
# That is all this shipped definition does for `txf`. The search rewrite behind the dashboard
# hook and compiled alerts calls it too, right after tenx-inflate and before its own extract and
# spath, with the field tenx_hide_others set: then the events this macro does not replay are
# hidden from its `extract` (the two foreach blocks, which run only when that field is present),
# so the rewrite extracts them exactly as it does when nothing is replayed.
#
# The `tenxreplay` command (run hourly by the "Rebuild Field Replay" saved search) writes this
# macro from the running instance's props for the original sourcetypes present. Every step it
# writes is guarded, so an event without tenx_sourcetype is handled exactly as here. It also
# writes one macro per original sourcetype (tenx-replay-u<hash>, with the alias
# tenx-replay-st-<sourcetype> that txf(<sourcetype>) calls), which the search rewrite strings
# together for the sourcetypes recorded in the indexes a search names. See
# bin/tenx_replay_builder.py.
#
[tenx-replay]
definition = foreach tenx_hide_others* fieldstr="@@TENXF@@" matchstr="@@TENXM@@" [eval tenx_hk_raw=if(isnull(tenx_rst), _raw, null()), tenx_hk_st=if(isnull(tenx_rst), sourcetype, null()), tenx_hk_src=if(isnull(tenx_rst), source, null()), tenx_hk_host=if(isnull(tenx_rst), host, null()) | eval _raw=if(isnull(tenx_rst), "", _raw), sourcetype=if(isnull(tenx_rst), "tenx_hidden", sourcetype), source=if(isnull(tenx_rst), "tenx_hidden", source), host=if(isnull(tenx_rst), "tenx_hidden", host)] | extract | foreach tenx_hide_others* fieldstr="@@TENXF@@" matchstr="@@TENXM@@" [eval _raw=coalesce(tenx_hk_raw, _raw), sourcetype=coalesce(tenx_hk_st, sourcetype), source=coalesce(tenx_hk_src, source), host=coalesce(tenx_hk_host, host) | fields - tenx_hk_*]

# Event types and tags of the events a per-sourcetype replay macro replayed, run once after
# them (txf(<sourcetype>), the search rewrite). It does nothing on a chunk of results without a
# replayed event. bin/tenx_replay_builder.py TAGS_STEPS holds the same text.
#
[tenx-replay-tags]
definition = eval tenx_go0z=if(isnotnull(tenx_rst),1,null()) | foreach tenx_go0z* fieldstr="@@TENXF@@" matchstr="@@TENXM@@" [eval tenx_rk_et=if(isnull(tenx_rst), eventtype, null()), tenx_rk_tag=if(isnull(tenx_rst), tag, null()) | foreach tag::* [eval "tenx_rk_<<FIELD>>"=if(isnull(tenx_rst), '<<FIELD>>', null())] | typer | tags | foreach tag::* [eval tenx_rk_all=mvappend(tenx_rk_all, '<<FIELD>>')] | eval eventtype=if(isnull(tenx_rst), tenx_rk_et, eventtype), tag=if(isnull(tenx_rst), tenx_rk_tag, mvsort(mvdedup(tenx_rk_all))) | foreach tag::* [eval "<<FIELD>>"=if(isnull(tenx_rst), null(), '<<FIELD>>')] | foreach tenx_rk_tag::* [eval "tag::<<MATCHSTR>>"=if(isnull(tenx_rst), '<<FIELD>>', 'tag::<<MATCHSTR>>')] | fields - tenx_rk_*] | fields - tenx_go0z

# An event indexed with a field map (bin/tenx_field_map.py) carries the original event's fields as
# indexed fields and the indexed field tenx_mapped. `extract` on its expanded text would add each
# field the original sourcetype extracts with MV_ADD a second time (Splunk Enterprise 10.4.3, the
# Windows add-on, 662 events: 104 of 184 fields differed from the same events searched without
# `tx`, 16,785 repeated values, and `stats count by EventID` counted each event twice), and run the
# rules that read other fields again. So `tx`,
# `txf` and `txf(<sourcetype>)` hide such an event from their extraction step: no text, and a
# sourcetype, source and host no props stanza names; tenx-mapped-restore gives them back. The
# event then has exactly its indexed fields and the expanded text (662 of 662 events, every field
# equal to the same events searched without `tx`). tenx_sourcetype is hidden too, so the replay
# of `txf`, which runs on events that carry it, leaves a mapped event alone: a forwarder that sets
# it sets it on mapped events as well, and the replay cleared and recomputed their fields from the
# hidden event (662 such events: 86 of 186 fields differed from raw through `txf`). Each step is a foreach over tenx_mapped*, which
# runs only on a chunk of results where some event has the field, and each eval is guarded per
# event, so an event without it is handled exactly as before.
#
[tenx-mapped-hide]
definition = foreach tenx_mapped* [eval tenx_fm_raw=if(isnull(tenx_mapped), null(), _raw), tenx_fm_st=if(isnull(tenx_mapped), null(), sourcetype), tenx_fm_src=if(isnull(tenx_mapped), null(), source), tenx_fm_host=if(isnull(tenx_mapped), null(), host), tenx_fm_tst=if(isnull(tenx_mapped), null(), tenx_sourcetype) | eval _raw=if(isnull(tenx_mapped), _raw, ""), sourcetype=if(isnull(tenx_mapped), sourcetype, "tenx_none"), source=if(isnull(tenx_mapped), source, "tenx_none"), host=if(isnull(tenx_mapped), host, "tenx_none"), tenx_sourcetype=if(isnull(tenx_mapped), tenx_sourcetype, null())]

[tenx-mapped-restore]
definition = foreach tenx_mapped* [eval _raw=coalesce(tenx_fm_raw, _raw), sourcetype=coalesce(tenx_fm_st, sourcetype), source=coalesce(tenx_fm_src, source), host=coalesce(tenx_fm_host, host), tenx_sourcetype=coalesce(tenx_fm_tst, tenx_sourcetype) | fields - tenx_fm_raw, tenx_fm_st, tenx_fm_src, tenx_fm_host, tenx_fm_tst]

# An event the sender passed whole (text that is not compact) keeps the fields Splunk extracted when it read it:
# the macros mark it tenx_passed before the expansion (`txf` only when it carries no tenx_sourcetype, since the
# field replay re-reads the others), and these two hide it from the `extract` that follows, as tenx-mapped-hide
# does for field-map events: no text, and a sourcetype, source and host no props stanza names. Splunk
# Enterprise 10.4.3, 12 CloudTrail JSON events sent whole: through `tx` and `txf` every value of 11 fields
# twice; hidden, all 14 fields equal the plain search on every event.
[tenx-whole-hide]
definition = foreach tenx_passed [eval tenx_passed_raw=if(isnull(tenx_passed), null(), _raw), tenx_passed_st=if(isnull(tenx_passed), null(), sourcetype), tenx_passed_src=if(isnull(tenx_passed), null(), source), tenx_passed_host=if(isnull(tenx_passed), null(), host) | eval _raw=if(isnull(tenx_passed), _raw, ""), sourcetype=if(isnull(tenx_passed), sourcetype, "tenx_none"), source=if(isnull(tenx_passed), source, "tenx_none"), host=if(isnull(tenx_passed), host, "tenx_none")]

[tenx-whole-restore]
definition = foreach tenx_passed [eval _raw=coalesce(tenx_passed_raw, _raw), sourcetype=coalesce(tenx_passed_st, sourcetype), source=coalesce(tenx_passed_src, source), host=coalesce(tenx_passed_host, host) | fields - tenx_passed_raw, tenx_passed_st, tenx_passed_src, tenx_passed_host] | fields - tenx_passed
