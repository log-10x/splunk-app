
# Timestamps: two things this has to get right, and both are about not letting
# a timestamp pass through floating point or through the viewer's clock.
#
# Precision. The engine emits the timestamp as an epoch in the event's own
# precision: 13 digits for milliseconds, 19 for nanoseconds. A 19-digit integer
# does not fit in the double that SPL arithmetic uses (about 15 significant
# digits), so dividing it to seconds loses the last few digits and %9Q then
# prints a number the event never contained. Instead the integer seconds are
# taken as the first 10 characters, which is safe, and the fraction digits are
# spliced into the format string as literal text, straight from the value, never
# through arithmetic.
#
# Zone. strftime renders in the timezone of whoever is running the search, so
# the same stored event would read differently for two people. The epoch is
# shifted by the viewer's own offset before formatting, which renders it in UTC
# for everyone. This is correct only because the Receiver feeding this app is
# required to run with 'timestampZone: UTC' (see the README): that setting is
# what fixes the zone a timestamp without its own zone marker is read in.
#
# Known edge: for a viewer in a zone observing DST, an event inside the hour
# around a transition can render an hour out, because the offset is sampled at
# the unshifted instant.
#
# Refusing rather than guessing. A pattern the app cannot reconstruct is marked when it is
# stored, in expand_unsafe, and the two cases are a back-reference and a pattern carrying more
# than one timestamp. Both are silent failures if expanded anyway: the search returns a
# result, just not the line that went in. When the field is set the macro leaves the compact
# event as it is and keeps tenx_expand_refused in the output, so a searcher can see that this
# event was not expanded and why. Both cases are prevented at the Receiver, by
# varMaxRecurIndexes: 0 and maxPerObject: 1, so on a correctly configured deployment nothing
# is refused.
#
# Macro for decoding 10x encoded events.
# The macro utilizes the 'tenx_dml' collection and 'tenx-dml-lookup' lookup to get the decoded values
# matching the encoded data, and then tailors the data together via the 'mvzip' SPL command.
#
# After decoding, removed the utilized tenx fields with the SPL 'fields' command to avoid streaming
# unnecessary data.
#
# For more details, see:
# collections.conf - The definition of the 'tenx_dml' collection.
# savedsearches.conf - Details about how the 'tenx_dml' collection gets populated.
# transforms.conf - The definition of the 'tenx-dml-lookup' lookup.
# 
[tenx-inflate]
definition = makemv delim="," tenx_vars | lookup tenx-dml-lookup _key AS tenx_hash OUTPUT part_0 AS tenx_part_0, pattern_parts AS tenx_log_parts, pattern_terminator AS tenx_log_term, timestamp_format AS tenx_ts_f, expand_unsafe AS tenx_expand_refused | eval tenx_ts_sec=tonumber(substr(tenx_var_0,1,10)), tenx_ts_fsrc=coalesce(substr(tenx_var_0,11),"") | eval tenx_ts_n=if(match(tenx_ts_f,"%\d+Q"),tonumber(replace(tenx_ts_f,"^.*%(\d+)Q.*$","\1")),0) | eval tenx_ts_fmt=if(tenx_ts_n>0,replace(tenx_ts_f,"%\d+Q",substr(tenx_ts_fsrc."000000000",1,tenx_ts_n)),tenx_ts_f) | eval tenx_tz=strftime(tenx_ts_sec,"%z") | eval tenx_tzs=if(substr(tenx_tz,1,1)=="-",-1,1)*((tonumber(substr(tenx_tz,2,2))*3600)+(tonumber(substr(tenx_tz,4,2))*60)) | eval tenx_ts_utc=tenx_ts_sec-tenx_tzs | eval _raw=if(isnull(tenx_log_term) OR coalesce(tenx_expand_refused,"")!="", _raw, if(tenx_ts_f == "", if(isnull(tenx_var_0), tenx_log_term, mvjoin(mvappend(tenx_part_0, tenx_var_0, mvzip(tenx_log_parts,tenx_vars,""), tenx_log_term),"")), replace(mvjoin(mvappend(mvzip(tenx_log_parts,tenx_vars,""), tenx_log_term),""), "__TENX_TS__", strftime(tenx_ts_utc, tenx_ts_fmt)))) | fields  - tenx_hash, tenx_log_parts, tenx_log_term, tenx_ts_f, tenx_part_0, tenx_var_0, tenx_vars, tenx_ts_sec, tenx_ts_fsrc, tenx_ts_n, tenx_ts_fmt, tenx_tz, tenx_tzs, tenx_ts_utc

# Same as the 'tenx-inflate' macro, but without the removal of tenx fields, allows for easier debugging.
#
[tenx-inflate-debug]
definition = makemv delim="," tenx_vars | lookup tenx-dml-lookup _key AS tenx_hash OUTPUT part_0 AS tenx_part_0, pattern_parts AS tenx_log_parts, pattern_terminator AS tenx_log_term, timestamp_format AS tenx_ts_f, expand_unsafe AS tenx_expand_refused | eval tenx_ts_sec=tonumber(substr(tenx_var_0,1,10)), tenx_ts_fsrc=coalesce(substr(tenx_var_0,11),"") | eval tenx_ts_n=if(match(tenx_ts_f,"%\d+Q"),tonumber(replace(tenx_ts_f,"^.*%(\d+)Q.*$","\1")),0) | eval tenx_ts_fmt=if(tenx_ts_n>0,replace(tenx_ts_f,"%\d+Q",substr(tenx_ts_fsrc."000000000",1,tenx_ts_n)),tenx_ts_f) | eval tenx_tz=strftime(tenx_ts_sec,"%z") | eval tenx_tzs=if(substr(tenx_tz,1,1)=="-",-1,1)*((tonumber(substr(tenx_tz,2,2))*3600)+(tonumber(substr(tenx_tz,4,2))*60)) | eval tenx_ts_utc=tenx_ts_sec-tenx_tzs | eval _raw=if(isnull(tenx_log_term) OR coalesce(tenx_expand_refused,"")!="", _raw, if(tenx_ts_f == "", if(isnull(tenx_var_0), tenx_log_term, mvjoin(mvappend(tenx_part_0, tenx_var_0, mvzip(tenx_log_parts,tenx_vars,""), tenx_log_term),"")), replace(mvjoin(mvappend(mvzip(tenx_log_parts,tenx_vars,""), tenx_log_term),""), "__TENX_TS__", strftime(tenx_ts_utc, tenx_ts_fmt))))

# Where the compact events are, for the app's own dashboards. The setup guide leaves the
# index and the sourcetype of compact events to the deployment, so no fixed name can be
# right: edit this definition to your compact index and sourcetype (Settings > Advanced
# search > Search macros). The default finds the app's own sourcetype in every index the
# searcher can read, which works out of the box and is slower than naming the index.
# Add each sourcetype you register for compact events here as well:
#     index=my_compact_index (sourcetype=tenx_encoded OR sourcetype=my_other_sourcetype)
#
[tenx-events]
definition = index=* sourcetype=tenx_encoded

# Macro for displaying a message as a search result.
# Simply appends a new synthetic event to an empty search.
#
[tenx-message(1)]
args = term
definition = search tenxsearchstringthatneverhits | append [| makeresults | eval _raw="$term$"]
