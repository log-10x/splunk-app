
# Timestamps: two things this has to get right, and both are about not letting
# a timestamp pass through floating point or through the viewer's clock.
#
# Precision. The engine emits the timestamp as an epoch in the event's own
# precision: 13 digits for milliseconds, 19 for nanoseconds. A 19-digit integer
# does not fit in the double that SPL arithmetic uses (about 15 significant
# digits), so dividing it to seconds loses the last few digits and %9Q then
# prints a number the event never contained. Instead the integer seconds are
# taken as the first 10 characters, which is safe, and the fraction digits are
# spliced into the format string as literal text, straight from the value, never
# through arithmetic.
#
# Zone. Every timestamp renders in UTC, for every viewer. strftime renders in the
# timezone of whoever runs the search, so nothing that depends on the hour goes through
# it: hours, minutes, seconds and AM/PM are computed from the epoch and spliced into the
# format as literal digits, and a zone directive prints UTC. strftime renders only the
# date, from that day's noon UTC shifted by the viewer's offset at noon, which lands on
# the same calendar date in every zone, a DST transition day included. This is correct
# because the Receiver feeding this app is required to run with 'timestampZone: UTC'
# (see the README): that setting is what fixes the zone a timestamp without its own
# zone marker is read in.
#
# Refusing rather than guessing. A pattern the app cannot reconstruct is marked when it is
# stored, in expand_unsafe, and the cases are a back-reference, a pattern carrying more than
# one timestamp, and two different templates stored under one hash (hash-conflict). Each is a
# silent failure if expanded anyway: the search returns a result, just not the line that went
# in. When the field is set the macro leaves the compact event as it is and keeps
# tenx_expand_refused in the output, so a searcher can see that this event was not expanded
# and why. The first two are prevented at the Receiver, by varMaxRecurIndexes: 0 and
# maxPerObject: 1; a hash conflict needs two different templates with one 64-bit hash.
#
# Values are read from the compact text itself. The search-time extraction of tenx_vars
# (transforms.conf [tenx-hash-vars-extraction]) trims white space at both ends of the field:
# measured on Splunk Enterprise 10.4.3, "~h,<epoch>,a,b<CR>" gave tenx_vars "a,b" and
# "~h,<epoch>,  a,b" gave "a,b". The engine leaves the CR of a CR LF line end at the end of the
# value before the template's line feed, so in a Windows event whose text ends with fixed lines
# the last value ends in CR or is a lone CR. Trimmed, that value lost its CR, or was dropped by
# makemv (which drops empty values), and mvzip then dropped the template text before it too: an
# empty line, or a whole line such as "Access Check Results:". The first eval takes everything
# after the second comma of _raw instead (the same split as the extraction regex), so every value
# keeps its characters. An event with no value after the epoch keeps the extraction's result.
# The second eval takes the first value the same way, between the first and second comma: on a
# template without a timestamp it is the text's first value, and trimmed, a first value of white
# space only was absent, which expanded the event to its last line alone.
#
# Sub-seconds. tenx-event-time (transforms.conf) gives every compact event with a timestamp a time with a
# fraction, so Splunk keeps _subsecond on it (props.conf ADD_EXTRA_TIME_FIELDS), .000 where the epoch's
# fraction digits are zeros. A raw event has _subsecond only when its timestamp printed sub-seconds. The
# template's timestamp format says which: an expanded event whose format has no fraction (%<n>Q) loses
# _subsecond, as its raw event never had one (Splunk Enterprise 10.4.3, Apache access lines: .000 on 60,000
# compact events, absent on the raw ones). An epoch written back as it is (__TENX_EPOCH__), or an event
# without a timestamp slot, keeps the field as it was.
#
# The last CR. An engine that reads a CR LF line end as one line break keeps the CR in the template, so the
# expansion of an event whose line ended in CR LF ends in a CR: in the template's last part or at the end of its
# last value. Splunk's raw event of the same line has none (its line breaking removes the CR LF), and with it a
# field rule ending in $ fails and .* captures it. The expansion drops exactly one CR at the very end of the
# text ((?![\s\S]) is the end of the text, where $ would also match before a final line feed); a CR inside the
# event, at the end of each earlier line, stays.
#
# Events sent as text. A line that does not start with ~ is an event the Receiver sent as its own
# text, in the same stream as the compact events: its template was not made yet (the Receiver's
# templateCreateAfter), or it is 65,535 characters or longer. Values are read only from a line that
# starts with ~, and the extraction (transforms.conf [tenx-hash-vars-extraction]) gives no other line a
# tenx_hash, so such an event is never looked up, keeps its text, and gets no tenx_expand_refused.
#
# Macro for decoding 10x encoded events.
# The macro utilizes the 'tenx_dml' collection and 'tenx-dml-lookup' lookup to get the decoded values
# matching the encoded data, and then tailors the data together via the 'mvzip' SPL command.
#
# After decoding, removed the utilized tenx fields with the SPL 'fields' command to avoid streaming
# unnecessary data.
#
# For more details, see:
# collections.conf - The definition of the 'tenx_dml' collection.
# savedsearches.conf - Details about how the 'tenx_dml' collection gets populated.
# transforms.conf - The definition of the 'tenx-dml-lookup' lookup.
# 
[tenx-inflate]
definition = eval tenx_vars=if(match(_raw, "^~[^,]+,[^,]+,[\s\S]"), replace(_raw, "^~[^,]+,[^,]+,", ""), tenx_vars) | eval tenx_var_0=if(match(_raw, "^~[^,]+,[^,]"), replace(_raw, "^~[^,]+,([^,]*)[\s\S]*$", "\1"), tenx_var_0) | makemv delim="," tenx_vars | lookup tenx-dml-lookup _key AS tenx_hash OUTPUT _key AS tenx_rows, part_0 AS tenx_part_0, pattern_parts AS tenx_log_parts, pattern_terminator AS tenx_log_term, timestamp_format AS tenx_ts_f, expand_unsafe AS tenx_expand_refused | eval tenx_n=mvcount(tenx_rows) | eval tenx_log_parts=if(tenx_n>1, mvindex(tenx_log_parts, 0, floor(mvcount(tenx_log_parts)/tenx_n)-1), tenx_log_parts), tenx_part_0=if(tenx_n>1, coalesce(mvindex(tenx_part_0, 0), ""), tenx_part_0), tenx_log_term=if(tenx_n>1, coalesce(mvindex(tenx_log_term, 0), ""), tenx_log_term), tenx_ts_f=if(tenx_n>1, coalesce(mvindex(tenx_ts_f, 0), ""), tenx_ts_f), tenx_expand_refused=if(tenx_n>1, coalesce(mvindex(tenx_expand_refused, 0), ""), tenx_expand_refused) | eval tenx_ts_sec=tonumber(substr(tenx_var_0,1,10)), tenx_ts_fsrc=coalesce(substr(tenx_var_0,11),"") | eval tenx_ts_n=if(match(tenx_ts_f,"%\d+Q"),tonumber(replace(tenx_ts_f,"^.*%(\d+)Q.*$","\1")),0) | eval tenx_ts_fmt=if(tenx_ts_n>0,replace(tenx_ts_f,"%\d+Q",substr(tenx_ts_fsrc."000000000",1,tenx_ts_n)),tenx_ts_f) | eval tenx_ts_sod=tenx_ts_sec-floor(tenx_ts_sec/86400)*86400, tenx_ts_h=floor(tenx_ts_sod/3600) | eval tenx_ts_fmt=replace(tenx_ts_fmt,"%%","__TENX_PCT__") | eval tenx_ts_fmt=replace(replace(replace(replace(tenx_ts_fmt,"%-H",printf("%d",tenx_ts_h)),"%-I",printf("%d",if(tenx_ts_h%12==0,12,tenx_ts_h%12))),"%-M",printf("%d",floor((tenx_ts_sod%3600)/60))),"%-S",printf("%d",tenx_ts_sod%60)) | eval tenx_ts_fmt=replace(replace(replace(replace(replace(tenx_ts_fmt,"%H",printf("%02d",tenx_ts_h)),"%I",printf("%02d",if(tenx_ts_h%12==0,12,tenx_ts_h%12))),"%M",printf("%02d",floor((tenx_ts_sod%3600)/60))),"%S",printf("%02d",tenx_ts_sod%60)),"%p",if(tenx_ts_h<12,"AM","PM")) | eval tenx_ts_fmt=replace(replace(replace(replace(replace(tenx_ts_fmt,"%:::z","+00"),"%:z","+00:00"),"%z","+0000"),"%Z","UTC"),"__TENX_PCT__","%%") | eval tenx_ts_noon=tenx_ts_sec-tenx_ts_sod+43200, tenx_tz=strftime(tenx_ts_noon,"%z") | eval tenx_tzs=if(substr(tenx_tz,1,1)=="-",-1,1)*((tonumber(substr(tenx_tz,2,2))*3600)+(tonumber(substr(tenx_tz,4,2))*60)) | eval tenx_ts_utc=tenx_ts_noon-tenx_tzs | eval tenx_text=if(isnull(tenx_log_term) OR coalesce(tenx_expand_refused,"")!="", null(), if(tenx_ts_f == "", if(isnull(tenx_var_0), tenx_log_term, mvjoin(mvappend(tenx_part_0, tenx_var_0, mvzip(tenx_log_parts,tenx_vars,""), tenx_log_term),"")), replace(mvjoin(mvappend(mvzip(tenx_log_parts,tenx_vars,""), tenx_log_term),""), "__TENX_TS__", if(tenx_ts_f=="__TENX_EPOCH__", tenx_var_0, strftime(tenx_ts_utc, tenx_ts_fmt))))) | eval tenx_text=replace(tenx_text, "\r(?![\s\S])", "") | eval tenx_expand_refused=case(isnull(tenx_log_term) AND match(_raw, "^~"), "no-template", isnotnull(tenx_log_term) AND coalesce(len(tenx_text),0)==0, if(len(mvjoin(tenx_expand_refused,""))>0, tenx_expand_refused, "empty-expansion"), true(), tenx_expand_refused), _raw=if(len(tenx_text)>0, tenx_text, _raw), _subsecond=if(len(tenx_text)>0 AND len(tenx_ts_f)>0 AND tenx_ts_f!="__TENX_EPOCH__" AND NOT match(tenx_ts_f, "%\d+Q"), null(), _subsecond) | fields  - tenx_text, tenx_rows, tenx_n, tenx_hash, tenx_log_parts, tenx_log_term, tenx_ts_f, tenx_part_0, tenx_var_0, tenx_vars, tenx_ts_sec, tenx_ts_fsrc, tenx_ts_n, tenx_ts_fmt, tenx_tz, tenx_tzs, tenx_ts_utc, tenx_ts_sod, tenx_ts_h, tenx_ts_noon

# Same as the 'tenx-inflate' macro, but without the removal of tenx fields, allows for easier debugging.
#
[tenx-inflate-debug]
definition = eval tenx_vars=if(match(_raw, "^~[^,]+,[^,]+,[\s\S]"), replace(_raw, "^~[^,]+,[^,]+,", ""), tenx_vars) | eval tenx_var_0=if(match(_raw, "^~[^,]+,[^,]"), replace(_raw, "^~[^,]+,([^,]*)[\s\S]*$", "\1"), tenx_var_0) | makemv delim="," tenx_vars | lookup tenx-dml-lookup _key AS tenx_hash OUTPUT _key AS tenx_rows, part_0 AS tenx_part_0, pattern_parts AS tenx_log_parts, pattern_terminator AS tenx_log_term, timestamp_format AS tenx_ts_f, expand_unsafe AS tenx_expand_refused | eval tenx_n=mvcount(tenx_rows) | eval tenx_log_parts=if(tenx_n>1, mvindex(tenx_log_parts, 0, floor(mvcount(tenx_log_parts)/tenx_n)-1), tenx_log_parts), tenx_part_0=if(tenx_n>1, coalesce(mvindex(tenx_part_0, 0), ""), tenx_part_0), tenx_log_term=if(tenx_n>1, coalesce(mvindex(tenx_log_term, 0), ""), tenx_log_term), tenx_ts_f=if(tenx_n>1, coalesce(mvindex(tenx_ts_f, 0), ""), tenx_ts_f), tenx_expand_refused=if(tenx_n>1, coalesce(mvindex(tenx_expand_refused, 0), ""), tenx_expand_refused) | eval tenx_ts_sec=tonumber(substr(tenx_var_0,1,10)), tenx_ts_fsrc=coalesce(substr(tenx_var_0,11),"") | eval tenx_ts_n=if(match(tenx_ts_f,"%\d+Q"),tonumber(replace(tenx_ts_f,"^.*%(\d+)Q.*$","\1")),0) | eval tenx_ts_fmt=if(tenx_ts_n>0,replace(tenx_ts_f,"%\d+Q",substr(tenx_ts_fsrc."000000000",1,tenx_ts_n)),tenx_ts_f) | eval tenx_ts_sod=tenx_ts_sec-floor(tenx_ts_sec/86400)*86400, tenx_ts_h=floor(tenx_ts_sod/3600) | eval tenx_ts_fmt=replace(tenx_ts_fmt,"%%","__TENX_PCT__") | eval tenx_ts_fmt=replace(replace(replace(replace(tenx_ts_fmt,"%-H",printf("%d",tenx_ts_h)),"%-I",printf("%d",if(tenx_ts_h%12==0,12,tenx_ts_h%12))),"%-M",printf("%d",floor((tenx_ts_sod%3600)/60))),"%-S",printf("%d",tenx_ts_sod%60)) | eval tenx_ts_fmt=replace(replace(replace(replace(replace(tenx_ts_fmt,"%H",printf("%02d",tenx_ts_h)),"%I",printf("%02d",if(tenx_ts_h%12==0,12,tenx_ts_h%12))),"%M",printf("%02d",floor((tenx_ts_sod%3600)/60))),"%S",printf("%02d",tenx_ts_sod%60)),"%p",if(tenx_ts_h<12,"AM","PM")) | eval tenx_ts_fmt=replace(replace(replac