
# Endpoint for the 10x-search handler, responsible for generating a splunk search job SID
# matching an input search string, but with all the 10x decoding capabilities embedded.
#
# See tenx_search_handler.py for more details.
#
[script:tenx-search]
match                 = /tenx-search
script                = tenx_search_handler.py
scripttype            = persist
handler               = tenx_search_handler.TenxSearchHandler
python.version        = python3
requireAuthentication = true
output_modes          = json
passPayload           = true
passHttpHeaders       = true
passHttpCookies       = true


# Endpoint for the config handler exposing configuring of the application.
#
# See tenx_config_handler.py for more detaills.
#
[script:tenx-config]
match                 = /tenx-config
script                = tenx_config_handler.py
scripttype            = persist
handler               = tenx_config_handler.TenxConfigHandler
python.version        = python3
requireAuthentication = true
output_modes          = json
passPayload           = true
passHttpHeaders       = true
passHttpCookies       = true
