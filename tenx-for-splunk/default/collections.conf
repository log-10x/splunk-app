
# Defines a kv store collection utilized by 10x to decode encoded events.
#
# For more details, see:
# macros.conf - The definitions of the macros utilizing the 'tenx_dml' collection
# savedsearches.conf - Details about how the 'tenx_dml' collection gets populated.
# transforms.conf - The definition of the lookup on the 'tenx_dml' collection
#
[tenx_dml]
field.pattern_hash = string
field.pattern = string
# pattern_parts is deliberately undeclared: it holds a multivalue, 'array' is not an
# accepted KV store field type, and declaring it 'string' would flatten the value the
# inflate macro feeds to mvzip.
field.part_0 = string
field.pattern_terminator = string
field.timestamp_format = string
# Empty when the pattern can be reconstructed. Non-empty names the reason it cannot, and
# the inflate macro then leaves the compact event alone rather than printing wrong text.
field.expand_unsafe = string
