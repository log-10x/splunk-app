
# Defines a kv store collection utilized by 10x to decode encoded events.
#
# For more details, see:
# macros.conf - The definitions of the macros utilizing the 'tenx_dml' collection
# savedsearches.conf - Details about how the 'tenx_dml' collection gets populated.
# transforms.conf - The definition of the lookup on the 'tenx_dml' collection
#
[tenx_dml]
# Replicated to the indexers with the knowledge bundle, so the inflate macro's lookup runs
# where the events are instead of on the search head. The dump Splunk ships keeps the
# multivalue pattern_parts. A template stored here reaches the indexers with the next
# bundle, about a minute after it is written.
replicate = true
field.pattern_hash = string
field.pattern = string
# pattern_parts is deliberately undeclared: it holds a multivalue, 'array' is not an
# accepted KV store field type, and declaring it 'string' would flatten the value the
# inflate macro feeds to mvzip.
field.part_0 = string
field.pattern_terminator = string
field.timestamp_format = string
# Empty when the pattern can be reconstructed. Non-empty names the reason it cannot, and
# the inflate macro then leaves the compact event alone rather than printing wrong text.
field.expand_unsafe = string
# The searchable text of the pattern: separators removed, line breaks as spaces. Search terms
# are matched against it to find the templates that carry them.
field.pattern_search = string
# "pending" until the searchable copy of the template is written, then "written".
field.search_copy = string
# The copy search reads the pending records (tenx_dml_intf.py); without this index it read the
# whole collection each time (5 to 6 s on 1,250,000 records, Splunk Enterprise 10.4.3).
accelerated_fields.tenx_search_copy = {"search_copy": 1}
# The hour Consume KV last wrote the record (epoch seconds // 3600, as text). The `tx` prefilter
# reads the records of recent hours by it when it holds an earlier answer for its words in
# tenx_dict_cache, instead of every record (tenx_prefilter_parser.cache_hours).
field.stored_hour = string
accelerated_fields.tenx_stored_hour = {"stored_hour": 1}

[tenx_dict_cache]
# Earlier answers of the `tx` prefilter's template dictionary, one record per searched piece
# (_key p_<piece>) and one for the timestamp formats (_key formats): n, the templates carrying the
# piece, hs, the TERM() of each (none past 5,000), full_at, when every record was last read for it,
# and through_hour, the first hour of records a later search reads again. It also keeps the answer of the
# prefilter's raw events check (_key c_<md5 of the check>: range, rows, at). Read and written on the
# search head only, by the prefilter (bin/tenx_prefilter.py), so it is not replicated.
replicate = false
field.n = number
field.full_at = number
field.through_hour = number

[tenx_kv_state]
# How far the Consume KV alert action has loaded template records: one record, key consume_kv.
# Read on the search head only (the action, the `tx` prefilter and Diagnostics), so it is not
# replicated to the indexers.
replicate = false
# The index time (epoch seconds) up to which every template record has been read and stored.
field.loaded_through = number
# When the action last wrote this record, epoch seconds.
field.updated = number
# current, loading (a run stopped with records left; the next run continues) or failed.
field.status = string
field.detail = string
field.records = number
# When the last run started and ended; a run that started and did not end was stopped from
# outside (the alert action's maxtime, a restart), and the next run records it in last_cut.
field.run_started = number
field.run_ended = number
field.last_cut = string
# When the first run of this app version started, epoch seconds (an install or an upgrade).
field.version_since = number
