
# Sourcetype for the incoming 10x templates.
#
# This is where the forwarder redirects the json objects describing the templates
# generated by the 10x pipeline.
#
# See savedsearches.conf for more details.
#
[tenx_dml_raw_json]
# No timestamp in a template record, so none is extracted. An empty DATETIME_CONFIG is read
# as a path to a datetime.xml file, which is what AppInspect rejects.
DATETIME_CONFIG = CURRENT
INDEXED_EXTRACTIONS = json
KV_MODE = none
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
category = Structured
description = Raw JSON templates from 10x pipeline for KV store population
disabled = false
pulldown_type = true
# A template record is one line however long the template is. Splunk's default of 10,000
# bytes cuts long templates (43,004 characters is the longest measured), and a word past the
# cut can never be found. The alert action refuses templates over 64K characters; 256 KB
# leaves room for JSON escaping and multi-byte characters, so every stored template is whole.
TRUNCATE = 262144

# Sourcetype for the processed 10x templates data.
#
# This sourcetype is populated by the 10x app using the Consume KV saved search.
#
# See savedsearches.conf for more details.
#
[tenx_dml_pure]
# As above: the pure form is the same template, written for search rather than for the KV
# store, and carries no time of its own.
DATETIME_CONFIG = CURRENT
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
SHOULD_LINEMERGE = false
category = Custom
disabled = false
pulldown_type = true
# As above. This is the copy the search rewrite probes, so a truncated record here means a
# search term that only appears past the cut resolves to no hashes.
TRUNCATE = 262144
# The hash is everything before the tab build_pure_dml_line writes. Hashes are not
# identifier-shaped: they carry punctuation and spaces.
EXTRACT-dml = ^(?<dml_hash>[^\t]+)

# The same searchable copy, written by the Consume KV alert with `collect` as sourcetype
# stash, which Splunk does not count against the licence. Splunk's own [stash] settings
# merge undated lines into one event and parse a time from the text, so this source keeps
# one template per event, whole, stamped with the time it was written.
[source::tenx_dml_pure]
DATETIME_CONFIG = CURRENT
LINE_BREAKER = ([\r\n]+)
SHOULD_LINEMERGE = false
TRUNCATE = 262144
EXTRACT-dml = ^(?<dml_hash>[^\t]+)

# Sourcetype for encoded 10x events.
#
# This sourcetype is used by the forwarder to send encoded log events
# that will be inflated at search time using the tenx-inflate macro.
#
[tenx_encoded]
# CURRENT: _time is the time Splunk indexed the event (_time equals _indextime, measured
# on Splunk 10.4.3). An empty value would read to AppInspect as a datetime.xml path.
#
# It is not a free choice. A compact event does carry the original timestamp, as an epoch
# in its first variable, but not every template has a timestamp slot at all, and the ones
# that do vary in precision between milliseconds and nanoseconds, which a single
# TIME_FORMAT cannot express. Making _time the original event time is a real change with
# its own measurement to do, not a side effect of closing a packaging check.
DATETIME_CONFIG = CURRENT
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
SHOULD_LINEMERGE = false
category = Custom
disabled = false
pulldown_type = true
REPORT-tenx = tenx-hash-vars-extraction
# A compact event is one line, and the Receiver can group consecutive lines of one message
# into a single event. Splunk's default of 10,000 bytes cuts such an event, and the cut
# drops its trailing values, so it expands to fewer lines than it holds. Measured on the
# OpenTelemetry demo sample: 11 of 3,723 events over 10,000 bytes (the longest 25,472),
# 279 of 5,000 lines lost at the default, all 5,000 back at 262,144.
TRUNCATE = 262144

