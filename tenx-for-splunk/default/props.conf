
# Sourcetype for the incoming 10x templates.
#
# This is where the forwarder redirects the json objects describing the templates
# generated by the 10x pipeline.
#
# See savedsearches.conf for more details.
#
[tenx_dml_raw_json]
# No timestamp in a template record, so none is extracted. An empty DATETIME_CONFIG is read
# as a path to a datetime.xml file, which is what AppInspect rejects.
DATETIME_CONFIG = CURRENT
# A record sent to HEC's event endpoint carries a time, and DATETIME_CONFIG does not apply
# there: Fluent Bit sends each template record with the time of the event that made the
# template. Consume KV reads the last seven minutes, so a template made by an older event
# was never stored and its events never expanded. Every template record takes the time it
# is indexed.
TRANSFORMS-tenx_dml_time = tenx-dml-time
# The two fields are read at search time by the Consume KV search. Indexing them as well
# put every template's text into the index files a second time.
KV_MODE = json
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
category = Custom
description = Raw JSON templates from 10x pipeline for KV store population
disabled = false
pulldown_type = true
# A template record is one line however long the template is. Splunk's default of 10,000
# bytes cuts long templates (43,004 characters is the longest measured), and a word past the
# cut can never be found. The alert action refuses templates over 64K characters; 256 KB
# leaves room for JSON escaping and multi-byte characters, so every stored template is whole.
TRUNCATE = 262144

# Sourcetype for the processed 10x templates data.
#
# This sourcetype is populated by the 10x app using the Consume KV saved search.
#
# See savedsearches.conf for more details.
#
[tenx_dml_pure]
# As above: the pure form is the same template, written for search rather than for the KV
# store, and carries no time of its own.
DATETIME_CONFIG = CURRENT
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
SHOULD_LINEMERGE = false
category = Custom
disabled = false
pulldown_type = true
# As above. This is the copy the search rewrite probes, so a truncated record here means a
# search term that only appears past the cut resolves to no hashes.
TRUNCATE = 262144
# The hash is everything before the tab build_pure_dml_line writes. Hashes are not
# identifier-shaped: they carry punctuation and spaces.
EXTRACT-dml = ^(?<dml_hash>[^\t]+)

# The same searchable copy, written by the Consume KV alert with `collect` as sourcetype
# stash, which Splunk does not count against the licence. Splunk's own [stash] settings
# merge undated lines into one event and parse a time from the text, so this source keeps
# one template per event, whole, stamped with the time it was written.
[source::tenx_dml_pure]
DATETIME_CONFIG = CURRENT
LINE_BREAKER = ([\r\n]+)
SHOULD_LINEMERGE = false
TRUNCATE = 262144
EXTRACT-dml = ^(?<dml_hash>[^\t]+)

# Sourcetype for encoded 10x events.
#
# This sourcetype is used by the forwarder to send encoded log events
# that will be inflated at search time using the tenx-inflate macro.
#
[tenx_encoded]
# _time is the original event time wherever the template has a timestamp slot, and where
# it has none the time the event arrived with: an HTTP Event Collector sender's time, else
# the time Splunk indexed it. An event sent with the indexed field tenx_time=sender keeps
# its sender's time either way (transforms.conf [tenx-event-time]). A compact event carries its timestamp
# as an epoch in its first variable, 13 digits for milliseconds or 19 for nanoseconds, so
# tenx-event-time (transforms.conf) reads it there. DATETIME_CONFIG = CURRENT is the
# fallback for events without one; an empty value would read to AppInspect as a
# datetime.xml path. Both are parsing settings: they apply on the instance that parses
# the data, an indexer or a heavy forwarder.
DATETIME_CONFIG = CURRENT
TRANSFORMS-tenx_time = tenx-event-time
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
SHOULD_LINEMERGE = false
category = Custom
disabled = false
pulldown_type = true
REPORT-tenx = tenx-hash-vars-extraction
# A compact event is one line, and the Receiver can group consecutive lines of one message
# into a single event. Splunk's default of 10,000 bytes cuts such an event, and the cut
# drops its trailing values, so it expands to fewer lines than it holds. Measured on the
# OpenTelemetry demo sample: 11 of 3,723 events over 10,000 bytes (the longest 25,472),
# 279 of 5,000 lines lost at the default, all 5,000 back at 262,144.
TRUNCATE = 262144
# A compact event read from a file (a forwarder's monitor input, a batch or oneshot input) passes
# Splunk's timestamp processor, which finds no time in the text under DATETIME_CONFIG = CURRENT and
# writes the indexed field timestamp=none (props.conf ADD_EXTRA_TIME_FIELDS). subseconds leaves that
# field out and keeps the sub-second part of _time that tenx-event-time sets. Measured on 300 compact
# CloudTrail events read by a oneshot input: timestamp=none on 300 without it, on 0 with it, _time equal
# on all 300. Events sent to HTTP Event Collector's event endpoint never had the field.
ADD_EXTRA_TIME_FIELDS = subseconds

# The app's own logs in $SPLUNK_HOME/var/log/splunk, which Splunk indexes into _internal. An event starts
# at a line that begins with the logger's time, so a traceback stays in the event that logged it and every
# event has its time: read line by line, each line of a traceback was an event without a time, and Splunk
# warned about each one in splunkd.log (DateParserVerbose).
[source::.../var/log/splunk/tenx_*.log*]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d\d-\d\d \d\d:\d\d:\d\d,\d{3} )
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 23

# The compact events read back from files, by a heavy forwarder or through a Universal Forwarder
# (transforms.conf [tenx-relay-line] and [tenx-record-unwrap]): Fluent Bit writes them under
# /opt/tenx/compact/events/, one folder per Receiver, and the template records outside it. Files
# elsewhere take a stanza of their own, in local/props.conf, with this TRANSFORMS- line. The class
# 00_tenx_unwrap sorts before tenx_time ([tenx_encoded]), so the line is unwrapped before that reads the
# event. On a host without this folder the stanza matches nothing.
[source::/opt/tenx/compact/events/...]
TRANSFORMS-00_tenx_unwrap = tenx-relay-line, tenx-record-unwrap

# Windows Security events in the rendered XML form. The Windows add-on reads dest from the XML text,
# which a compact event does not carry; where the Receiver attaches Computer, this sets dest from it.
# A search-time extraction leaves a field that already has a value as it is (transforms.conf MV_ADD).
# The class name sorts after the add-on's dest classes so that those run first.
[source::XmlWinEventLog:Security]
REPORT-tenx_dest = tenx-computer-as-dest

# Splunk Stream events. The Stream add-on reads src and dest from the event text, which a compact event
# does not carry; where the Receiver attaches src_ip and dest_ip, this gives src and dest their values.
# ASNEW sets each alias only on an event where that field has no value.
[source::stream:*]
FIELDALIAS-tenx_src_dest = src_ip ASNEW src dest_ip ASNEW dest
