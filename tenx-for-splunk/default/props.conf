
# Sourcetype for the incoming 10x templates.
#
# This is where the forwarder redirects the json objects describing the templates
# generated by the 10x pipeline.
#
# See savedsearches.conf for more details.
#
[tenx_dml_raw_json]
DATETIME_CONFIG = 
INDEXED_EXTRACTIONS = json
KV_MODE = none
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
category = Structured
description = Raw JSON templates from 10x pipeline for KV store population
disabled = false
pulldown_type = true

# Sourcetype for the processed 10x templates data.
#
# This sourcetype is populated by the 10x app using the Consume KV saved search.
#
# See savedsearches.conf for more details.
#
[tenx_dml_pure]
DATETIME_CONFIG =
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
SHOULD_LINEMERGE = false
category = Custom
disabled = false
pulldown_type = true
# The hash is everything before the tab build_pure_dml_line writes. The previous pattern,
# ^(?<dml_hash>\$?\w+), assumed an identifier-shaped hash: on the E21 capture it matched
# nothing at all for 1,957 of 2,991 hashes and matched a wrong prefix for another 953, so
# search terms resolved to no hashes and a search for text in the original line returned
# nothing, with no error.
EXTRACT-dml = ^(?<dml_hash>[^\t]+)

# Sourcetype for encoded 10x events.
#
# This sourcetype is used by the forwarder to send encoded log events
# that will be inflated at search time using the tenx-inflate macro.
#
[tenx_encoded]
DATETIME_CONFIG =
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
SHOULD_LINEMERGE = false
category = Custom
disabled = false
pulldown_type = true
REPORT-tenx = tenx-hash-vars-extraction

