
# Sourcetype for the incoming 10x templates.
#
# This is where the forwarder redirects the json objects describing the templates
# generated by the 10x pipeline.
#
# See savedsearches.conf for more details.
#
[tenx_dml_raw_json]
# No timestamp in a template record, so none is extracted. An empty DATETIME_CONFIG is read
# as a path to a datetime.xml file, which is what AppInspect rejects.
DATETIME_CONFIG = CURRENT
INDEXED_EXTRACTIONS = json
KV_MODE = none
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
category = Structured
description = Raw JSON templates from 10x pipeline for KV store population
disabled = false
pulldown_type = true

# Sourcetype for the processed 10x templates data.
#
# This sourcetype is populated by the 10x app using the Consume KV saved search.
#
# See savedsearches.conf for more details.
#
[tenx_dml_pure]
# As above: the pure form is the same template, written for search rather than for the KV
# store, and carries no time of its own.
DATETIME_CONFIG = CURRENT
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
SHOULD_LINEMERGE = false
category = Custom
disabled = false
pulldown_type = true
EXTRACT-dml = ^(?<dml_hash>\$?\w+)

# Sourcetype for encoded 10x events.
#
# This sourcetype is used by the forwarder to send encoded log events
# that will be inflated at search time using the tenx-inflate macro.
#
[tenx_encoded]
# CURRENT, which is what this sourcetype already did. Measured on Splunk 10.4.3 with the
# value left empty: _time came back equal to _indextime for every event, so Splunk was
# assigning the ingest time and extracting nothing. Naming it changes no behaviour and
# stops AppInspect reading the empty value as a path to a datetime.xml file.
#
# It is not a free choice. A compact event does carry the original timestamp, as an epoch
# in its first variable, but not every template has a timestamp slot at all, and the ones
# that do vary in precision between milliseconds and nanoseconds, which a single
# TIME_FORMAT cannot express. Making _time the original event time is a real change with
# its own measurement to do, not a side effect of closing a packaging check.
DATETIME_CONFIG = CURRENT
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
SHOULD_LINEMERGE = false
category = Custom
disabled = false
pulldown_type = true
REPORT-tenx = tenx-hash-vars-extraction

