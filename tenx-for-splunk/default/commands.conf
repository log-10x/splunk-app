
# Defines a generating command for creating searches on 10x encoded data.
#
# See tenxsearch.py for more info.
#
[tenxsearch]
filename = tenxsearch.py
chunked = true
python.version = python3
python.required = 3.13

# Recompiles every alert made in the Compile Alert view so it picks up templates that
# appeared after it was compiled. Run on a schedule by the "Recompile Compiled Alerts" saved
# search. See tenxrecompile.py.
#
[tenxrecompile]
filename = tenxrecompile.py
chunked = true
python.version = python3
python.required = 3.13
