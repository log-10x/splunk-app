
# General configuration of the 10x app.
# 
[config]

# Where the searchable copy of each template is written, and the name it carries: its
# source (written with `collect` as sourcetype stash, which is not licence-metered), and the
# sourcetype of copies an install already holds. props.conf keys [source::tenx_dml_pure] on
# the default name, so changing dml_source_type needs a matching stanza there.
# See props.conf for more info.
#
# This index must exist before the app runs. It defaults to the index the app already
# searches for incoming templates rather than to main.
dest_dml_index = tenx_dml
dml_source_type = tenx_dml_pure

# Defines the name of the kv store used by the 10x app to decode events.
# See collections.conf for more info.
#
collection_name = tenx_dml

# Defines information about how the 10x template is utilized for decoding events.
# See tenx_dml_to_kv.py and macros.conf for more info.
#
timestamp_placeholder = __TENX_TS__
variable_separator = $

# Defines the extraction on encoded events which allows the 10x app to decode them.
# See macros.conf and transforms.conf for more info.
#
tenx_extraction_name=REPORT-tenx
tenx_extraction=tenx-hash-vars-extraction

# Field replay (bin/tenxreplay.py, the "Rebuild Field Replay" saved searches): limits on the
# tenx-replay macro it writes for compact events that carry their original sourcetype
# (tenx_sourcetype). See bin/tenx_replay_builder.py, build_capped() and expire_covered().
#
# Past replay_max_sourcetypes distinct original sourcetypes, the least busy are not replayed.
# Past replay_max_macro_chars (0: no limit) or the commands Splunk runs in one search,
# source:: and host:: rules are limited to those matching a source or host seen, then the
# least busy sourcetypes are left out. Each cut is logged in tenx_replay_command.log and
# returned by `| tenxreplay`.
replay_max_sourcetypes = 200
replay_max_macro_chars = 0
#
# A sourcetype that no compact event has carried for this many days loses its replay; 0 keeps
# it for ever. 400 days: longer than a year of retained security logs (the usual retention
# requirement) plus a month, so searches over archived compact events keep their fields. Raise
# it if compact events are kept and searched for longer.
replay_expire_days = 400

# Field narrowing in the `tx` prefilter (bin/tenx_prefilter_parser.py). Off: a field comparison
# after `tx` (user=bob, EventCode IN (4624, 4625)) does not narrow which compact events are
# expanded. On: it narrows like the value written as a word, for fields whose value is text of
# the event; that needs the list tenxreplay writes, which it writes only while some compact
# event carries tenx_sourcetype. On is faster when a field selects a small share of a large
# index; a field whose value is not text of the event and that the list does not name (a rule
# defined only in another app or privately) makes `tx` return fewer events than the raw search.
field_narrowing = false
